[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eponge"
version = "0.2.0"
description = "Segmentation, porosity and microstructure analysis for pFIB-SEM stacks of porous catalyst layers."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Éponge capstone team (CMU 2026)" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "tifffile>=2024.1",
  "Pillow>=10.0",
  "torch>=2.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
export = ["onnx>=1.15", "onnxruntime>=1.17", "onnxscript"]
viz3d = ["plotly>=5.0"]
napari = ["napari>=0.4.19"]
dev = ["pytest>=7"]

[project.scripts]
eponge = "eponge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eponge = ["weights/*.pt", "weights/*.json"]
